>API-сервер</text><line stroke="#A2B5C2" stroke-dasharray="9 9" stroke-width="2" x1="945" x2="945" y1="242" y2="1124" /><rect fill="#EDF4F8" height="78" rx="15" ry="15" stroke="#A9C3D4" stroke-width="2" width="264" x="1188" y="164" /><text fill="#203044" font-family="DejaVu Sans" font-size="20" font-weight="bold" text-anchor="middle" x="1320.0" y="209.4">ML-воркер</text><line stroke="#A2B5C2" stroke-dasharray="9 9" stroke-width="2" x1="1320" x2="1320" y1="242" y2="1124" /><rect fill="#EDF4F8" height="78" rx="15" ry="15" stroke="#A9C3D4" stroke-width="2" width="264" x="1563" y="164" /><text fill="#203044" font-family="DejaVu Sans" font-size="20" font-weight="bold" text-anchor="middle" x="1695.0" y="209.4">Хранилище</text><line stroke="#A2B5C2" stroke-dasharray="9 9" stroke-width="2" x1="1695" x2="1695" y1="242" y2="1124" /><polyline fill="none" marker-end="url(#arrow)" points="195,293 560,293" stroke="#55758B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" /><text fill="#203044" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle" x="382.5" y="278">1. Загрузить аудио</text><polyline fill="none" marker-end="url(#arrow)" points="570,360 935,360" stroke="#55758B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" /><text fill="#203044" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle" x="757.5" y="345">2. Отправить файл</text><polyline fill="none" marker-end="url(#arrow)" points="945,430 1685,430" stroke="#55758B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" /><text fill="#203044" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle" x="1320.0" y="415">3. Сохранить исходник</text><polyline fill="none" marker-end="url(#arrow)" points="945,500 580,500" stroke="#55758B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" /><text fill="#203044" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle" x="757.5" y="485">4. ID трека и предпросмотр</text><polyline fill="none" marker-end="url(#arrow)" points="195,570 560,570" stroke="#55758B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" /><text fill="#203044" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle" x="382.5" y="555">5. Указать фрагмент и правку</text><polyline fill="none" marker-end="url(#arrow)" points="570,645 935,645" stroke="#55758B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" /><text fill="#203044" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle" x="757.5" y="630">6. Создать задачу</text><polyline fill="none" marker-end="url(#arrow)" points="945,720 1310,720" stroke="#55758B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" /><text fill="#203044" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle" x="1132.5" y="705">7. Запустить обработку</text><polyline fill="none" marker-end="url(#arrow)" points="1320,795 1685,795" stroke="#55758B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" /><text fill="#203044" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle" x="1507.5" y="780">8. Загрузить исходник</text><polyline fill="none" marker-end="url(#arrow)" points="1320,866 1685,866" stroke="#55758B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" /><text fill="#203044" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle" x="1507.5" y="851">9. Сохранить результат</text><polyline fill="none" marker-end="url(#arrow)" points="1320,938 955,938" stroke="#55758B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" /><text fill="#203044" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle" x="1132.5" y="923">10. Статус: готово</text><polyline fill="none" marker-end="url(#arrow)" points="945,1010 580,1010" stroke="#55758B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" /><text fill="#203044" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle" x="757.5" y="995">11. Вернуть статус и ссылку</text><polyline fill="none" marker-end="url(#arrow)" points="570,1083 205,1083" stroke="#55758B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" /><text fill="#203044" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle" x="382.5" y="1068">12. Показать, сравнить, скачать</text><text fill="#637186" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle" x="970" y="1170">Примечание: при ошибке API возвращает статус и сообщение без ссылки на результат.</text></svg>